name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rybio_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rybio_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true

      # Osobna, tymczasowa baza tylko dla GitHub Actions.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rybio_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rybio_ci?schema=public

      # Placeholdery potrzebne wyłącznie do poprawnego zbudowania aplikacji.
      # CI nie loguje się do prawdziwego Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Prepare temporary CI database
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build
